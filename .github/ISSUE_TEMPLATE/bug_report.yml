name: Bug Report
description: File a bug report to help improve Oriented-Direct
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue. Please fill out the form below with as much detail as possible to help us reproduce and resolve the problem.
  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: A clear and concise description of what the bug is.
      placeholder: Provide a clear summary of the bug...
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior, including any relevant .osp code snippet.
      placeholder: |
        1. Write the following .osp code: ...
        2. Run 'ospc ...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: Describe what should have happened...
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: A clear and concise description of what actually happened, including error messages or unexpected output.
      placeholder: Describe what actually happened...
    validations:
      required: true
  - type: input
    id: ospc-version
    attributes:
      label: ospc Version
      description: Version of ospc compiler you are using (run `ospc --version`).
      placeholder: "e.g., 1.0.0"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: Version of Node.js you are using (run `node -v`).
      placeholder: "e.g., v20.10.0"
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating System
      description: The operating system on which you encountered the issue.
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, compiler logs, stack traces, or relevant configuration details here.
    validations:
      required: false
